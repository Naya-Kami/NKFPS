name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      entry: ${{ steps.site.outputs.entry }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Record the built entry point
        id: site
        run: |
          entry=$(sed -n 's/.*<script type="module"[^>]*src="\([^"]*\)".*/\1/p' dist/index.html)
          test -n "$entry"
          echo "entry=$entry" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Wait for branch publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)" = legacy ]; then
            run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" \
              -f head_sha="$GITHUB_SHA" \
              --jq 'first(.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment" or .name == "pages-build-deployment")) | .id')
            if [ -n "$run_id" ] && [ "$run_id" != null ]; then
              gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 5
            fi
          fi
      - id: publish
        uses: actions/deploy-pages@v4
      - name: Verify the published FPS entry
        env:
          PAGES_URL: ${{ steps.publish.outputs.page_url }}
          BUILT_ENTRY: ${{ needs.build.outputs.entry }}
        run: |
          site=${PAGES_URL%/}/
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 "${site}?deploy=$GITHUB_SHA" -o "$RUNNER_TEMP/nkfps.html" &&
              grep -Fq 'id="practice-button"' "$RUNNER_TEMP/nkfps.html" &&
              grep -Fq "src=\"$BUILT_ENTRY\"" "$RUNNER_TEMP/nkfps.html" &&
              curl --fail --silent --show-error --max-time 10 -o /dev/null "${site}${BUILT_ENTRY#./}"; then
              echo "The published page serves the FPS entry and the bundle from this build."
              exit 0
            fi
            sleep 5
          done
          echo "::error::GitHub Pages did not serve the expected build at $site"
          exit 1
