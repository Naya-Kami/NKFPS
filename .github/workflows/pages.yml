name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Migrate branch publishing to GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_endpoint="repos/$GITHUB_REPOSITORY/pages"
          if [ "$(gh api "$pages_endpoint" --jq .build_type)" = legacy ]; then
            gh api --method PUT "$pages_endpoint" -f build_type=workflow
          fi
      - id: publish
        uses: actions/deploy-pages@v4
